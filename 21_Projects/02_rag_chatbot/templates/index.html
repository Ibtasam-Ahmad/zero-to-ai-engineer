<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RAG Chatbot</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<style>
  :root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--accent:#58a6ff;--user:#1f6feb;--bot:#161b22;}
  body{background:var(--bg);color:#e6edf3;font-family:'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column;}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px;}
  .topbar h1{font-size:1.1rem;margin:0;font-weight:600;}
  .sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:12px;overflow-y:auto;}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  #chat-window{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}
  .bubble{max-width:72%;padding:10px 14px;border-radius:12px;font-size:.92rem;line-height:1.5;}
  .bubble.user{background:var(--user);align-self:flex-end;border-bottom-right-radius:2px;}
  .bubble.bot{background:var(--bot);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:2px;}
  .sources{font-size:.78rem;color:#8b949e;margin-top:6px;}
  .source-chip{background:#21262d;border:1px solid var(--border);border-radius:4px;padding:2px 7px;margin:2px;display:inline-block;}
  .input-row{background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:8px;}
  #msg-input{flex:1;background:#0d1117;border:1px solid var(--border);color:#e6edf3;border-radius:8px;padding:8px 12px;outline:none;}
  #msg-input:focus{border-color:var(--accent);}
  .btn-send{background:var(--accent);border:none;color:#000;border-radius:8px;padding:8px 18px;font-weight:600;cursor:pointer;}
  .btn-send:hover{opacity:.85;}
  .typing{display:flex;gap:4px;align-items:center;padding:10px 14px;}
  .dot{width:7px;height:7px;background:#8b949e;border-radius:50%;animation:bounce .9s infinite;}
  .dot:nth-child(2){animation-delay:.15s;}
  .dot:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
  .session-item{padding:6px 10px;border-radius:6px;cursor:pointer;font-size:.82rem;color:#8b949e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .session-item:hover,.session-item.active{background:#21262d;color:#e6edf3;}
  .upload-btn{background:#238636;border:none;color:#fff;border-radius:6px;padding:5px 12px;font-size:.8rem;cursor:pointer;}
</style>
</head>
<body>
<div class="topbar">
  <span style="font-size:1.4rem">🤖</span>
  <h1>RAG Chatbot</h1>
  <div class="ms-auto d-flex align-items-center gap-2">
    <input type="file" id="pdf-input" accept=".pdf" style="display:none"/>
    <button class="upload-btn" onclick="document.getElementById('pdf-input').click()">📎 Upload PDF</button>
    <span id="upload-status" class="text-secondary small"></span>
  </div>
</div>
<div style="display:flex;flex:1;overflow:hidden">
  <div class="sidebar">
    <div style="font-size:.75rem;color:#8b949e;margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.05em">Sessions</div>
    <button class="btn-send w-100 mb-2" style="font-size:.8rem;background:#238636" onclick="newSession()">+ New Chat</button>
    <div id="session-list"></div>
  </div>
  <div class="main">
    <div id="chat-window">
      <div class="bubble bot">👋 Hello! Upload PDFs and ask me anything about them. I'll retrieve relevant passages and generate an answer.</div>
    </div>
    <div class="input-row">
      <input id="msg-input" placeholder="Ask a question about your documents..." onkeydown="if(event.key==='Enter')sendMsg()"/>
      <button class="btn-send" onclick="sendMsg()">Send</button>
    </div>
  </div>
</div>

<script>
let sessionId = null;

function newSession(){
  sessionId = null;
  document.getElementById('chat-window').innerHTML = '<div class="bubble bot">👋 New session started. Ask me anything!</div>';
  refreshSessions();
}

async function refreshSessions(){
  const r = await fetch('/sessions');
  const d = await r.json();
  const list = document.getElementById('session-list');
  // DOM elements + textContent, so a session id cannot inject HTML/script
  list.replaceChildren(...d.sessions.map(s=>{
    const item = document.createElement('div');
    item.className = 'session-item' + (s===sessionId ? ' active' : '');
    item.textContent = s.slice(0,18) + '...';
    item.onclick = () => loadSession(s);
    return item;
  }));
}

function loadSession(sid){
  sessionId = sid;
  document.getElementById('chat-window').innerHTML = '';
  addBubble('bot', `📂 Resumed session: ${sid.slice(0,18)}...`, null);
  refreshSessions();
}

function addBubble(role, text, sources){
  const win = document.getElementById('chat-window');
  const div = document.createElement('div');
  div.className = `bubble ${role}`;
  // textContent, not innerHTML: text from PDFs is shown as text, never run as HTML
  text.split('\n').forEach((line, i)=>{ if(i) div.appendChild(document.createElement('br')); div.appendChild(document.createTextNode(line)); });
  if(sources && sources.length){
    const sd = document.createElement('div');
    sd.className='sources';
    sd.textContent = '📄 Sources: ';
    sources.forEach(s=>{ const chip = document.createElement('span'); chip.className='source-chip'; chip.textContent = s.source; sd.appendChild(chip); });
    div.appendChild(sd);
  }
  win.appendChild(div);
  win.scrollTop = win.scrollHeight;
}

function showTyping(){
  const win = document.getElementById('chat-window');
  const d = document.createElement('div');
  d.className='bubble bot typing'; d.id='typing-indicator';
  d.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  win.appendChild(d); win.scrollTop=win.scrollHeight;
}

function removeTyping(){ const t=document.getElementById('typing-indicator'); if(t)t.remove(); }

async function sendMsg(){
  const inp = document.getElementById('msg-input');
  const msg = inp.value.trim();
  if(!msg) return;
  inp.value='';
  addBubble('user', msg, null);
  showTyping();
  try{
    const r = await fetch('/chat',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:msg, session_id: sessionId||undefined})
    });
    const d = await r.json();
    removeTyping();
    if(!sessionId){ sessionId=d.session_id; refreshSessions(); }
    addBubble('bot', d.response, d.sources);
  }catch(e){
    removeTyping();
    addBubble('bot','❌ Error: '+e.message, null);
  }
}

document.getElementById('pdf-input').addEventListener('change', async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const status = document.getElementById('upload-status');
  status.textContent = '⏳ Uploading...';
  const fd = new FormData(); fd.append('file', file);
  const r = await fetch('/upload-doc',{method:'POST',body:fd});
  const d = await r.json();
  status.textContent = r.ok ? `✅ ${d.filename} (${d.chunks_ingested} chunks)` : `❌ ${d.detail}`;
  setTimeout(()=>status.textContent='', 4000);
});

refreshSessions();
</script>
</body>
</html>
